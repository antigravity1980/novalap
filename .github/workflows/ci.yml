name: CI Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos
          - linux
          - all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: TypeScript check
        run: pnpm tsc --noEmit
        working-directory: src-vite

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjpeg-turbo8-dev nasm cmake libpng-dev libtiff-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        shell: bash
        run: bash scripts/download_ffmpeg_sidecar.sh linux x86_64 2>&1 || echo "FFmpeg download skipped"
      - name: Rust check
        shell: bash
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1
          echo "Rust check exit code: $?"

  # ─── Windows (x86_64 only) ─────────────────────────────
  build-windows:
    needs: [lint-frontend]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'))
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          Write-Host "pnpm exit: $LASTEXITCODE"
        working-directory: src-vite
      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download FFmpeg Sidecars
        run: |
          .\scripts\download_ffmpeg_sidecar.ps1 -Arch x64 2>&1
          Write-Host "ffmpeg exit: $LASTEXITCODE"
      - name: Build Tauri app (Windows x64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target x86_64-pc-windows-msvc --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
        continue-on-error: true
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novalap-windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ─── macOS (Apple Silicon only) ─────────────────────────
  build-macos:
    needs: [lint-frontend]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          brew install nasm pkg-config jpeg-turbo libpng libtiff 2>&1 || true
          echo "brew exit: $?"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "exit: $?"
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        shell: bash
        run: bash scripts/download_ffmpeg_sidecar.sh macos aarch64 2>&1 || echo "FFmpeg download skipped"
      - name: Build Tauri app (macOS ARM64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
        continue-on-error: true
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novalap-macos-arm64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ─── Linux (x86_64) ────────────────────────────────────
  build-linux:
    needs: [lint-frontend]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libjpeg-turbo8-dev nasm cmake \
            libpng-dev libtiff-dev 2>&1
          echo "apt exit: $?"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "exit: $?"
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        shell: bash
        run: bash scripts/download_ffmpeg_sidecar.sh linux x86_64 2>&1 || echo "FFmpeg download skipped"
      - name: Download AI Models
        shell: bash
        run: bash scripts/download_models.sh 2>&1 || echo "Models download skipped"
      - name: Build Tauri app (Linux x86_64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target x86_64-unknown-linux-gnu --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
        continue-on-error: true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novalap-linux-x86_64-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn
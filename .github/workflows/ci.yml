name: CI Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos
          - linux
          - all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: TypeScript check
        run: pnpm tsc --noEmit
        working-directory: src-vite

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjpeg-turbo8-dev nasm cmake libpng-dev libtiff-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        run: bash scripts/download_ffmpeg_sidecar.sh linux x86_64 2>&1 || true
      - name: Rust check
        env:
          LAPAI_SKIP_NATIVE_BUILD: 1
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1; echo "EXIT=$?"

  build-windows:
    needs: [lint-frontend]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'))
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - name: Install NASM
        run: choco install -y nasm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Download FFmpeg Sidecars
        run: .\scripts\download_ffmpeg_sidecar.ps1 -Arch x64 2>&1 || echo "ok"
      - name: Build Tauri (Windows x64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target x86_64-pc-windows-msvc --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: LapAI-windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-macos:
    needs: [lint-frontend]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install system dependencies
        run: brew install nasm pkg-config jpeg-turbo libpng libtiff 2>&1 || true
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        run: bash scripts/download_ffmpeg_sidecar.sh macos aarch64 2>&1 || true
      - name: Build Tauri (macOS ARM64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LapAI-macos-arm64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-linux:
    needs: [lint-frontend]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjpeg-turbo8-dev nasm cmake libpng-dev libtiff-dev
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite
      - name: Download FFmpeg Sidecars
        run: bash scripts/download_ffmpeg_sidecar.sh linux x86_64 2>&1 || true
      - name: Download AI Models
        run: bash scripts/download_models.sh 2>&1 || true
      - name: Build Tauri (Linux x86_64)
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --verbose --target x86_64-unknown-linux-gnu --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LapAI-linux-x86_64-${{ github.sha }}
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn